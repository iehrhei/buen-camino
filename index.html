<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex"><title>Buen Camino</title>
<meta name="description" content="一本自九世纪起就在路上的书，陪你跟着真实的历史人物读朝圣之路，并排出自己的行程。">
<meta property="og:title" content="Buen Camino"><meta property="og:description" content="跟着真实的历史人物读朝圣之路，并排出自己的行程。">
<link rel="icon" href="assets/rose.png"><link rel="stylesheet" href="fonts/fonts.css">
</head><body>
<style>
/* Layout: an annotated printed sheet. Real paper, real fragments, hand colouring along the road. One old-paper look; the two times swap between two real papers. */
:root{
  color-scheme:light;
  --paper:#ECDDB8; --sheet:#ECDDB8; --card:#F3E7CB; --ink:#2A2118; --mute:#64533A; --red:#B3261E; --road:#C8922B; --sea:#D9D6B6; --land:#E5D2A2; --tex:url(assets/paper_old.jpg);
  --f-title:"Noto Serif SC","Noto Serif CJK SC","Songti SC",serif;
  --f-body:"Noto Serif SC","Noto Serif CJK SC","Songti SC",serif;
  --f-gothic:"UnifrakturMaguntia","Noto Serif SC",serif;
}
body.now{--paper:#E3DFD0;--sheet:#E3DFD0;--card:#EFECDF;--sea:#D2D8CF;--land:#E0DAC5;--tex:url(assets/paper_now.jpg)}
html,body{height:100%}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--paper) var(--tex);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.7;overflow:hidden}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
h1,h2,h3,p,figure{margin:0}
#map{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab;background:var(--paper) var(--tex)}
.frame{position:fixed;inset:6px;border:2px solid var(--ink);outline:1px solid var(--ink);outline-offset:-6px;pointer-events:none;z-index:1}
#map .seafill{fill:#AFC7B4;opacity:.3;mix-blend-mode:multiply}
#map .landf{fill:var(--paper);fill-opacity:.82}
#map .wash{fill:none;stroke:#7C9A55;stroke-width:26px;opacity:.26;vector-effect:non-scaling-stroke}
#map .coast{fill:none;stroke:var(--ink);stroke-width:1.5px;stroke-linejoin:round;vector-effect:non-scaling-stroke}
#map .vg{mix-blend-mode:multiply}
#map .seab{fill:var(--paper);stroke:var(--ink);stroke-width:1.4}
#map .seat{font-family:var(--f-body);font-size:13px;font-weight:700;fill:var(--ink)}
#map .r{fill:none;stroke:var(--ink);stroke-width:2.4px;stroke-dasharray:.1 7;opacity:.38;stroke-linecap:round;vector-effect:non-scaling-stroke}
#map .r.op{opacity:.62}
#map .r.on{opacity:.95;stroke-width:3.2px;stroke-dasharray:.1 9}
#map .rhit{fill:none;stroke:transparent;stroke-width:14px;vector-effect:non-scaling-stroke;cursor:pointer}
#map .plan{fill:none;stroke:var(--ink);stroke-width:14px;opacity:.05;stroke-linecap:round;vector-effect:non-scaling-stroke}
#map .segi{fill:none;stroke-width:12px;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke;opacity:0;transition:opacity .7s;mix-blend-mode:multiply}
#map .segi.l1{opacity:.4}#map .segi.l2{opacity:.85}
#map .segt{fill:none;stroke:var(--ink);stroke-width:3.2px;stroke-dasharray:.1 9;stroke-linecap:round;vector-effect:non-scaling-stroke;opacity:0}
#map .segt.l1{opacity:1}#map .segt.l2{opacity:0}
#map .seg{fill:none;stroke:var(--ink);stroke-width:2.6px;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke;opacity:0;transition:opacity .7s}
#map .seg.l2{opacity:1}
#map .sweep{fill:none;stroke-width:12px;stroke-linecap:round;vector-effect:non-scaling-stroke;opacity:0;mix-blend-mode:multiply}
#map .sweep.go{opacity:1;animation:sweep 2.4s ease-in-out forwards}
@keyframes sweep{from{stroke-dashoffset:1}84%{stroke-dashoffset:0;opacity:1}to{stroke-dashoffset:0;opacity:0}}
#map .dd{opacity:.18;pointer-events:none;transition:opacity .9s}
#map .dd.l1{opacity:.55}#map .dd.l2{opacity:1}
#map .dd.off,#map .br.off{display:none}
#map .br{fill:none;stroke:var(--ink);stroke-width:1.5px;stroke-dasharray:4 4;vector-effect:non-scaling-stroke}
.rn{font-size:11.5px;font-style:italic;fill:var(--ink);opacity:.6;pointer-events:none}.rn.on{opacity:0}
.node{cursor:pointer;outline:none}.node.off{display:none}
.node .hit{fill:transparent}
.node .pip{fill:var(--card);stroke:var(--ink);stroke-width:2.2}
.node.seen .pip{fill:var(--red)}
.node.sel .pip{stroke-width:3.8}
.node .halo{fill:none;stroke:var(--red);stroke-width:1.6;opacity:0}
.node.res .halo{opacity:1;animation:pulse 2.8s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.25)}}
.node .nm{font-size:13.5px;font-weight:700;fill:var(--ink);paint-order:stroke;stroke:var(--card);stroke-width:4px;stroke-linejoin:round}
.node .pl{font-size:12px;fill:var(--ink);paint-order:stroke;stroke:var(--card);stroke-width:4px;stroke-linejoin:round}
.node:focus-visible .pip{stroke-width:4}
.node .ic{fill:var(--ink);pointer-events:none}.node.sd.seen .ic{fill:var(--card)}
.left{position:fixed;left:max(22px,env(safe-area-inset-left,0px));top:calc(22px + env(safe-area-inset-top,0px));width:246px;display:grid;gap:8px;max-height:calc(100% - 44px);overflow-y:auto;z-index:2}
.brand{font-family:var(--f-gothic);font-size:38px;line-height:1;color:var(--ink)}
.brand small{display:block;font-family:var(--f-body);font-size:11.5px;line-height:1.7;color:var(--mute)}
.lens{display:grid;grid-template-columns:1fr 1fr;border:1.5px solid var(--ink);background:var(--card)}
.lens button{border:0;background:none;padding:4px;font-weight:700;font-size:14.5px}
.lens button[aria-pressed="true"]{background:var(--ink);color:var(--card)}
.who{background:var(--card);border:1.5px solid var(--ink);padding:9px;display:grid;gap:6px}
.who h2{font-size:17px;line-height:1.3}
.who small{font-size:12px;color:var(--mute);line-height:1.3}
.who p{font-size:12.5px;line-height:1.55}
.quals{display:grid;gap:4px}
.q{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:6px;align-items:center;font-size:12.5px}
.bar{height:7px;border:1px solid var(--ink)}.bar i{display:block;height:100%;background:var(--ink);transition:width .4s}
.q b{font-variant-numeric:tabular-nums}
.q.over b{color:var(--red)}.q.over .bar i{background:var(--red)}
.tallies{display:grid;grid-template-columns:repeat(3,1fr);background:var(--card);border:1.5px solid var(--ink);font-size:12px;text-align:center;padding:2px}
.tallies b{display:block;font-size:19px;line-height:1.25}
.key{display:flex;gap:10px;font-size:12px;align-items:center;flex-wrap:wrap}
.key span{display:inline-flex;gap:3px;align-items:center}
.key svg{width:16px;height:16px;fill:var(--ink)}
.zm{display:flex;gap:5px;flex-wrap:wrap}
.zm button{min-width:28px;height:27px;border:1px solid var(--ink);background:var(--card);padding:0 7px;font-size:12.5px}
.right{position:fixed;right:max(22px,env(safe-area-inset-right,0px));top:calc(22px + env(safe-area-inset-top,0px));bottom:calc(22px + env(safe-area-inset-bottom,0px));width:min(420px,36vw);display:grid;grid-template-rows:auto minmax(0,1fr);z-index:2}
.tabs{display:flex}
.tabs button{flex:1;min-width:0;border:1.5px solid var(--ink);border-bottom:0;margin-right:-1.5px;background:var(--paper);padding:3px 2px;font-weight:700;font-size:13.5px;white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--card)}
.sheet{background:var(--card) var(--tex);background-blend-mode:soft-light;border:1.5px solid var(--ink);overflow-y:auto;padding:13px;display:grid;gap:11px;align-content:start}
.prog{display:grid;gap:4px;border-bottom:1.5px solid var(--ink);padding-bottom:8px}
.prog .ln{display:flex;justify-content:space-between;gap:8px;align-items:baseline;font-size:19px;font-weight:700;line-height:1.2}
.prog small{font-size:12px;font-weight:400;font-variant-numeric:tabular-nums;white-space:nowrap}
.prog .track{height:7px;border:1px solid var(--ink)}.prog .track i{display:block;height:100%;background:var(--road);transition:width .6s}
.voice{font-size:13.5px;line-height:1.5;color:var(--red);font-weight:700}
.gl{display:grid;grid-template-columns:44px minmax(0,1fr);gap:9px;align-items:center}
.gf{width:44px;height:44px;object-fit:cover;border-radius:50%;display:block;mix-blend-mode:multiply}
.gl p{font-size:14px;line-height:1.6;font-style:italic}
.st{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:start}
.cameo{width:92px;height:112px;display:grid;place-items:center;border:1px solid var(--ink);background:var(--paper) var(--tex);overflow:hidden}
.cameo img{max-width:100%;max-height:100%;mix-blend-mode:multiply}
.st h2{font-size:23px;line-height:1.3;text-wrap:balance}
.meta{font-size:12px;margin-bottom:2px;color:var(--mute)}
.tag{display:inline-block;border:1px solid var(--ink);font-size:11.5px;padding:0 6px;margin:4px 4px 0 0}
.tag.l{color:var(--red);border-color:var(--red)}.tag.g{border-style:dashed}
.body{font-size:15px;line-height:1.85}.body p+p{margin-top:8px}
.choice{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 12px;align-items:center;border-top:1px solid var(--ink);padding-top:8px}
.choice h3{font-size:16px;line-height:1.35}
.choice p{font-size:13px;line-height:1.5}
.go{border:1.5px solid var(--ink);background:var(--ink);color:var(--card);padding:4px 12px;font-weight:700;font-size:14px}
.go:hover{background:var(--red);border-color:var(--red)}
.hush{background:var(--ink);color:#F1E6CC;padding:11px 13px;font-size:14px;line-height:1.75}
.hush b{font-size:16px;display:block;margin-bottom:2px}
.out{border-left:4px solid var(--road);padding:4px 10px;font-size:14.5px;line-height:1.7}
.delta{font-size:12.5px;display:block;margin-top:3px;font-weight:700}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.help{font-size:12.5px;line-height:1.55;color:var(--mute)}
.mini{border:1px solid var(--ink);background:none;padding:1px 10px;font-size:12.5px}
.h{font-size:22px;line-height:1.25;font-weight:700}
.rl{display:grid}
.rl button{display:grid;grid-template-columns:14px minmax(0,1fr) auto;gap:2px 8px;align-items:center;text-align:left;background:none;border:0;border-top:1px solid var(--ink);padding:7px 2px}
.rl button[aria-pressed="true"] b{color:var(--red)}
.rl button:disabled{opacity:.5;cursor:default}
.rl i{width:12px;height:12px;border:1px solid var(--ink)}
.rl b{font-size:16px;line-height:1.3}
.rl span{font-size:12px;font-variant-numeric:tabular-nums}
.rl em{grid-column:2/-1;font-style:normal;font-size:13px;line-height:1.5}
.stat{font-size:13px;line-height:1.7;border:1px solid var(--ink);padding:8px 10px}
.folk{display:grid;gap:8px}
.fk{border-top:1px solid var(--ink);padding-top:5px}
.fk header{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.fk header b{font-size:18px}
.fk header span{font-size:13px}
.fk p{font-size:13.5px;line-height:1.65}
.fk .kk{font-weight:700;font-variant-numeric:tabular-nums}
.fk .ghsay{font-style:italic;color:var(--red)}
.fk .ghsay::before{content:"它说："}
.fk small,.deb small{display:block;font-size:11.5px;color:var(--mute)}
.fk.me header b{color:var(--red)}
.deb{border-top:1px solid var(--ink);padding-top:7px}
.deb h3{font-size:16.5px;line-height:1.3}.deb p{font-size:14px;line-height:1.65}
.sb{font-size:17px;line-height:1.3;border-bottom:1.5px solid var(--ink)}
.trs{display:grid}
.tr{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:8px;align-items:center;text-align:left;background:none;border:0;border-bottom:1px solid rgba(42,33,24,.4);padding:5px 2px}
.tr:hover b{color:var(--red)}
.tl{width:24px;height:24px;fill:var(--ink)}
.tr b{font-size:15.5px;line-height:1.3;display:block}
.tr small{font-size:12.5px;display:block}
.tr em{font-style:normal;font-size:12px}
.chat{display:grid;gap:7px}.chat:empty{display:none}
.chat p{font-size:14.5px;line-height:1.65;padding:6px 10px;border:1px solid var(--ink);max-width:92%;white-space:pre-wrap;overflow-wrap:anywhere}
.chat .me{justify-self:end;background:var(--ink);color:var(--card)}
.chat .it{justify-self:start}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.askf{display:grid;gap:4px}.askf .row{flex-wrap:nowrap}
.askf input{flex:1;min-width:0;border:1.5px solid var(--ink);background:transparent;padding:5px 8px;font-size:14px}
.fld{display:grid;grid-template-columns:62px minmax(0,1fr) 70px;gap:8px;align-items:center;font-size:13px}
.fld input[type=range]{width:100%;accent-color:var(--red);min-width:0}
.fld output{text-align:right;font-variant-numeric:tabular-nums}
.pick{display:grid;gap:3px}
.pick label{display:grid;grid-template-columns:18px minmax(0,1fr) auto;gap:6px;align-items:baseline;font-size:13.5px;padding:3px 0;border-top:1px solid rgba(42,33,24,.4)}
.pick input{margin:0;accent-color:var(--red)}
.pick small{font-size:12px;font-variant-numeric:tabular-nums}
.verdict{border:1.5px solid var(--ink);padding:10px 12px;display:grid;gap:5px}
.verdict h3{font-size:17px;line-height:1.4;color:var(--red)}
.verdict table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.verdict td{padding:1px 0}.verdict td:last-child{text-align:right}
.verdict p{font-size:13px;line-height:1.55}
.chk{display:flex;flex-wrap:wrap;gap:4px}
.chk span{font-size:12px;border:1px solid var(--ink);padding:0 6px;opacity:.5}.chk span.y{opacity:1;background:var(--ink);color:var(--card)}
.chooser{position:fixed;inset:0;background:var(--paper) var(--tex);display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:12px;padding-block:calc(24px + env(safe-area-inset-top,0px)) calc(24px + env(safe-area-inset-bottom,0px));padding-left:max(30px,env(safe-area-inset-left,0px));padding-right:max(30px,env(safe-area-inset-right,0px));z-index:4;justify-items:center;overflow-y:auto}
.chooser header{text-align:center}
.chooser h2{font-size:32px;line-height:1.2}
.chooser header p{font-size:14px}
.plates{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;width:min(1000px,100%);min-height:0;align-content:center}
.pc{position:relative;display:grid;grid-template-rows:auto auto auto auto auto;gap:2px;text-align:left;background:none;border:0;padding:0;min-height:0}
.pi{display:block;border:2px solid var(--ink);overflow:hidden;aspect-ratio:1/1;max-height:48vh}
.pi img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s}
.pc:hover .pi img{transform:scale(1.04)}
.pc b{font-size:23px;line-height:1.3;margin-top:6px}
.lat{font-family:var(--f-gothic);font-size:17px;line-height:1.1;color:var(--mute)}
.pk{font-size:13px;font-weight:700}
.pd{font-size:13.5px;line-height:1.5}
.pc i{position:absolute;left:8px;top:8px;font-style:normal;font-size:12.5px;font-weight:700;background:var(--red);color:#F6ECD6;padding:0 8px}
.stuck{font-size:12.5px;color:var(--mute)}
.intro{position:fixed;inset:0;display:grid;place-items:center;padding-block:calc(16px + env(safe-area-inset-top,0px)) calc(16px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:radial-gradient(ellipse at 50% 45%,rgba(34,24,15,.34),rgba(24,16,10,.8) 78%);z-index:5}
.intro.gone{display:none}
.skip{position:fixed;right:max(18px,env(safe-area-inset-right,0px));top:calc(12px + env(safe-area-inset-top,0px));background:none;border:0;color:#E9DCBC;font-size:13px;z-index:6}
.cover{position:relative;height:min(86vh,720px);max-width:84vw;aspect-ratio:1020/1500;border:0;padding:0;background:none;container-type:inline-size;transform:rotate(-.7deg);transform-origin:left center;filter:drop-shadow(16px 22px 22px rgba(10,6,3,.55));transition:transform .25s ease}
.cover:hover{transform:rotate(-.7deg) translateY(-3px)}
.cover.opening{transform:perspective(1800px) rotateY(-112deg);transition:transform .56s cubic-bezier(.55,.05,.55,.95)}
.cover .cv{position:relative;width:100%;height:100%;display:block}
.leaves{position:absolute;top:1.2%;bottom:.4%;left:1%;right:-1.1%;border-radius:0 3.2% 2.4% 0/0 2.2% 1.6% 0;background:repeating-linear-gradient(0deg,#efe4c6 0 2px,#d8ccab 2px 3px);box-shadow:1px 2px 0 #b9ad8d}
.ribbon{position:absolute;bottom:-5.5%;left:20%;width:4%;height:8%;background:linear-gradient(90deg,#6e1712,#9c2a20 50%,#6e1712);clip-path:polygon(0 0,100% 0,100% 100%,50% 82%,0 100%);z-index:-1}
.spread{width:min(1040px,100%);height:min(660px,88vh);display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1fr);padding:11px;border-radius:20px;background:#224E38 url(assets/leather.jpg) center/cover;color:#2a2118;box-shadow:inset 0 0 0 1px rgba(0,0,0,.35),inset 0 0 18px rgba(0,0,0,.45),18px 24px 44px rgba(10,6,3,.55);animation:leaf .3s ease-out}
@keyframes leaf{from{opacity:0}to{opacity:1}}
.pgl,.pgr{background:#F1E6C6 url(assets/page.jpg) no-repeat;background-size:200% 100%;position:relative}
.pgl{display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:8px;padding:18px 26px 14px 30px;border-radius:14px 0 0 14px;background-position:left top;box-shadow:inset -22px 0 26px -18px rgba(80,58,24,.42);min-width:0;min-height:0;margin:0}
.pgr{border-radius:0 14px 14px 0;background-position:right top;box-shadow:inset 22px 0 26px -18px rgba(80,58,24,.42)}
.pgr::before{content:"";position:absolute;left:-1px;top:8%;bottom:8%;width:2px;background:repeating-linear-gradient(180deg,rgba(120,98,66,.55) 0 7px,transparent 7px 46px)}
.rh{font-family:"EB Garamond",var(--f-body);font-size:12px;letter-spacing:.14em;color:#3b3024;margin:0}
.rh.r{text-align:right}
.ph{display:flex;align-items:center;gap:8px;color:#C0302E;font-size:19px;font-weight:900;letter-spacing:.04em;margin:0 0 2px -2px}
.ph .mg{width:18px;height:18px;fill:#C0302E;flex:none}
.pgl img{width:100%;height:100%;min-height:0;object-fit:contain;display:block;mix-blend-mode:multiply;filter:grayscale(1) brightness(1.22) contrast(1.75) url(#redink)}
.pgl figcaption{font-size:12.5px;text-align:center;color:#6b5a44;font-style:italic}
.pgr{padding:18px 34px 14px 36px;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:10px;min-width:0;overflow:hidden}
.say{display:grid;gap:9px;align-content:start;font-size:17.5px;line-height:1.75;text-align:justify}
.say{min-height:0;overflow-y:auto}
.say p{animation:ink .4s both}
.say p.back{color:#C0302E;font-style:italic}
@keyframes ink{from{opacity:0}to{opacity:1}}
.ans{display:grid;gap:6px}
.ans{gap:0;align-content:end}
.ans button{background:none;border:0;border-bottom:1px dotted rgba(60,44,28,.55);padding:6px 2px 6px 22px;text-align:left;font-size:15.5px;line-height:1.45;color:#2a2118;position:relative}
.ans button::before{content:"☞";position:absolute;left:0;color:#C0302E}
.ans button:hover{color:#C0302E;background:none}
.ans #nx{border:0;text-align:right;color:#C0302E;font-weight:700;padding-right:2px}
.ans #nx::before{content:none}
.ans #nx::after{content:" →"}
.pgno{font-family:"EB Garamond",var(--f-body);font-size:12px;text-align:center;letter-spacing:.1em;margin-top:4px;color:#6b5a44}
@media (max-width:860px){
  .frame{display:none}
  .left{left:max(14px,env(safe-area-inset-left,0px));right:max(14px,env(safe-area-inset-right,0px));top:calc(10px + env(safe-area-inset-top,0px));width:auto;grid-template-columns:minmax(0,1fr) 130px;align-items:center;gap:6px;max-height:none;overflow:visible}
  .brand{font-size:28px}.brand small{display:none}
